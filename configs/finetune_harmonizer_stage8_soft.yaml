seed: 44
dataset:
  source_manifest: manifests/input_raw_manifest.jsonl
  strips_per_image: 60
  strip_height: 1024
  outer_width: 128
  inner_width: 128
  seam_jitter_px: 6
  boundary_band_px: 24
  corruptions:
    spatial_probability:
      ab: 0.78
      d: 0.68
    group_c_probability: 0.60
    group_d_probability: 0.25
    op_count_weights: [0.18, 0.40, 0.30, 0.12]
model:
  architecture: seam_harmonizer_v3
  in_channels: 9
  channels: [32, 64, 128, 192]
  blocks: [2, 2, 4, 6]
  correction_limits:
    gain_limit: 1.80
    gamma_limit: 1.80
    bias_limit: 0.50
    mix_limit: 0.90
    detail_limit: 0.35
    gate_bias: -0.10
loss:
  low_sigma: 5.0
  # Default weights from HarmonizerLossComputer — no stage7 over-aggression.
  # Confidence supervision rebalance lives in a separate diff; this stage only
  # warm-starts the new attention_head from the legacy base ckpt.
  weights:
    rec: 0.8
    seam: 1.3
    low: 1.2
    grad: 0.25
    chroma: 0.7
    stats: 0.35
    lab: 0.8
    gate: 0.03
    field: 0.10
    detail: 0.08
    matrix: 0.10
    profile: 0.55
    conf_align: 0.18
    overcorr: 0.22
train:
  seed: 44
  lr: 1.0e-5
  encoder_lr_scale: 0.2
  freeze_correction_epochs: 1
  weight_decay: 1.0e-4
  betas: [0.9, 0.99]
  precision: bf16
  batch_size: 16
  val_batch_size: 16
  num_epochs: 4
  num_workers: 4
  compile: false
scheduler:
  warmup_steps: 50
  min_lr_scale: 0.2
ema:
  decay: 0.999
logging:
  tensorboard: true
  log_dir: outputs/logs/tensorboard_harmonizer_stage8_soft
  log_interval: 20
  console_log_interval: 25
